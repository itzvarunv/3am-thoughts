<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
@keyframes t1{0%,0%{opacity:0}4%,94%{opacity:1}100%{opacity:0}}
@keyframes t2{0%,4%{opacity:0}8%,94%{opacity:1}100%{opacity:0}}
@keyframes rl{0%,8%{opacity:0}12%,94%{opacity:1}100%{opacity:0}}
@keyframes tr{0%,16%{stroke-dashoffset:1;opacity:0}17%{opacity:1}28%,94%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes trt{0%,26%{opacity:0}30%,94%{opacity:1}100%{opacity:0}}
@keyframes q{0%,34%{opacity:0}38%,94%{opacity:1}100%{opacity:0}}
@keyframes ar{0%,42%{stroke-dashoffset:1;opacity:0}43%{opacity:1}48%,94%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes et{0%,44%{opacity:0}48%,94%{opacity:1}100%{opacity:0}}
@keyframes o0{0%,52%{opacity:0}56%,94%{opacity:1}100%{opacity:0}}
@keyframes o1{0%,56%{opacity:0}60%,94%{opacity:1}100%{opacity:0}}
@keyframes st{0%,62%{stroke-dashoffset:1;opacity:0}63%{opacity:1}67%,94%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes o2{0%,68%{opacity:0}72%,94%{opacity:1}100%{opacity:0}}
@keyframes ck{0%,74%{opacity:0;transform:scale(0)}78%{opacity:1;transform:scale(1.5)}82%,94%{opacity:1;transform:scale(1)}100%{opacity:0}}
@keyframes o3{0%,80%{opacity:0}84%,94%{opacity:1}100%{opacity:0}}
@keyframes ft{0%,87%{opacity:0}91%,94%{opacity:1}100%{opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.25) rotate(-8deg)}}
@keyframes march{to{stroke-dashoffset:-32}}
.a{animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:ease-out;opacity:0}
.d{stroke-dasharray:1;stroke-dashoffset:1}
.q{transform-box:fill-box;transform-origin:center}
.reality{animation:rl 12s infinite ease-out, march 2s linear infinite}
.ck{transform-box:fill-box;transform-origin:center;animation:ck 12s infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}
  </style>
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7">
        <animate attributeName="seed" values="7;11;3;7" dur="0.45s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" scale="3.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#ff3cac" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="1000" height="620" fill="#0b0b0b"/>

  <g font-family="'Caveat','Chalkboard SE','Comic Sans MS','Segoe Print',cursive" fill="#f2f2f2" filter="url(#rough)">
    <text x="40" y="58" font-size="36" class="a" style="animation-name:t1">the universe runs the real laws.</text>
    <text x="40" y="98" font-size="36" class="a" style="animation-name:t2">we run <tspan fill="#ff3cac">our best guess</tspan> of them.</text>

    <g class="reality" style="opacity:0">
      <path d="M110 330 C 100 200, 300 150, 470 165 C 640 180, 700 250, 690 360 C 680 480, 520 560, 330 545 C 170 530, 118 450, 110 330 Z"
            fill="none" stroke="#f2f2f2" stroke-width="2.6" stroke-dasharray="9 7"/>
      <text x="140" y="200" font-size="26">reality (all of it)</text>
    </g>

    <path class="a d" style="animation-name:tr" pathLength="1" d="M270 350 C 262 285, 330 255, 395 262 C 465 270, 495 318, 488 368 C 480 425, 420 450, 360 445 C 300 440, 276 405, 270 350 Z"
          fill="none" stroke="#39ff88" stroke-width="3"/>
    <g class="a" style="animation-name:trt" fill="#39ff88">
      <text x="300" y="345" font-size="24">tested range</text>
      <text x="296" y="375" font-size="20">F = ma works ✓</text>
      <text x="300" y="402" font-size="20">PV = nRT works ✓</text>
    </g>

    <g fill="#ff3cac" font-size="44">
      <text x="610" y="315" class="q" style="opacity:0;animation:q 12s infinite ease-out, pulse 1.6s 0s infinite ease-in-out">?</text>
      <text x="600" y="455" class="q" style="opacity:0;animation:q 12s infinite ease-out, pulse 1.6s 0.5s infinite ease-in-out">?</text>
      <text x="175" y="470" class="q" style="opacity:0;animation:q 12s infinite ease-out, pulse 1.6s 1.0s infinite ease-in-out">?</text>
    </g>
    <path class="a d" style="animation-name:ar" pathLength="1" d="M605 300 C 560 295, 515 305, 494 325" fill="none" stroke="#ff3cac" stroke-width="2" marker-end="url(#arr)"/>
    <g class="a" style="animation-name:et" fill="#ff3cac" font-size="20">
      <text x="495" y="232">edge case waiting</text>
      <text x="495" y="255">(Mercury, blackbody...)</text>
    </g>

    <text x="735" y="190" font-size="28" class="a" style="animation-name:o0">so to predict:</text>

    <g class="a" style="animation-name:o1">
      <text x="735" y="245" font-size="24">1. clone universe</text>
      <text x="760" y="278" font-size="18" fill="#bdbdbd">Heisenberg + self-ref</text>
      <text x="760" y="300" font-size="18" fill="#bdbdbd">+ you'd clone our ignorance</text>
    </g>
    <path class="a d" style="animation-name:st" pathLength="1" d="M745 255 L 955 232" stroke="#ff3cac" stroke-width="3" fill="none"/>

    <g class="a" style="animation-name:o2">
      <text x="735" y="355" font-size="24">2. few dials + keep</text>
      <text x="735" y="383" font-size="24">   recalibrating</text>
      <text x="760" y="410" font-size="18" fill="#bdbdbd">Kalman / digital twin</text>
    </g>
    <text x="905" y="388" font-size="30" fill="#39ff88" class="ck" style="opacity:0">✓</text>

    <g class="a" style="animation-name:o3">
      <text x="735" y="465" font-size="24">3. fundamental units</text>
      <text x="735" y="493" font-size="24">   only as dials</text>
      <text x="760" y="520" font-size="18" fill="#bdbdbd">Buckingham Pi</text>
    </g>

    <text x="40" y="595" font-size="22" fill="#bdbdbd" class="a" style="animation-name:ft">physics = humans turning one dial at a time for 300 years.   AI = same thing, automated.</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
